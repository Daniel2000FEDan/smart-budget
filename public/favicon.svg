<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="128" fill="#090d16" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)" />

  <!-- Inner subtle border -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />

  <!-- Wallet Body -->
  <g transform="translate(106, 136)">
    <!-- Main wallet back -->
    <rect x="0" y="30" width="300" height="200" rx="36" fill="#1e1b4b" stroke="rgba(255,255,255,0.3)" stroke-width="6"/>
    
    <!-- Wallet flap -->
    <path d="M0 66 C0 40, 20 20, 46 20 L254 20 C280 20, 300 40, 300 66 L300 90 L0 90 Z" fill="#312e81" opacity="0.9"/>
    
    <!-- Accent line -->
    <line x1="30" y1="90" x2="270" y2="90" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>

    <!-- Clasp / Lock -->
    <rect x="210" y="105" width="80" height="50" rx="20" fill="#090d16" stroke="rgba(255,255,255,0.4)" stroke-width="5"/>
    <circle cx="240" cy="130" r="12" fill="#fbbf24" filter="url(#glow)"/>

    <!-- Emerging coins / sparkles -->
    <circle cx="90" cy="2" r="32" fill="#10b981" opacity="0.9"/>
    <text x="90" y="14" font-family="system-ui, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle">₪</text>

    <circle cx="160" cy="-20" r="24" fill="#fbbf24" opacity="0.95"/>
    <text x="160" y="-10" font-family="system-ui, sans-serif" font-weight="900" font-size="26" fill="#78350f" text-anchor="middle">₪</text>
  </g>
</svg>